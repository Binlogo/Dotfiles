# Minimal tmux — the persistence layer beneath cmux. Use it for tasks that must
# survive detach or a front-end crash, and be re-attached from another device
# over ssh/mosh (see `tw` / `wt` in ~/.zshrc). cmux stays the daily driver; this
# file stays small ON PURPOSE. Resist tinkering here — that is the whole point
# (terminal stack is frozen; see the FOMO gate in ~/.config/ghostty/config).

set  -g  mouse on
set  -g  history-limit 50000
set  -g  focus-events on
set  -sg escape-time 10            # snappy ESC over mosh; friendlier to TUIs / vim
setw -g  mode-keys vi

# Truecolor passthrough so agent TUIs (Claude Code, etc.) render correctly.
set  -g  default-terminal "tmux-256color"
set  -ga terminal-overrides ",xterm-ghostty:Tc,xterm-256color:Tc,*256col*:Tc"

# Lean status bar — session name + clock, nothing to fiddle with.
set  -g  status-style  "bg=default"
set  -g  status-left   ""
set  -g  status-right  "#S  %H:%M"
